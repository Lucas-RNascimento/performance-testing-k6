name: K6 Performance Tests

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      test_type:
        description: "Choose test type: smoke | load | stress"
        required: true
        default: "smoke"

jobs:
  k6-tests:
    runs-on: ubuntu-latest

    env:
      BASE_URL: https://test-api.k6.io
      ENDPOINT: /public/crocodiles/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install k6
        run: |
            curl -sSL https://github.com/grafana/k6/releases/download/v0.51.0/k6-v0.51.0-linux-amd64.tar.gz -o k6.tar.gz
            tar -xzf k6.tar.gz
            sudo mv k6-v0.51.0-linux-amd64/k6 /usr/local/bin/k6
            k6 version


      - name: Create results folder
        run: mkdir -p results

      - name: Determine test type
        run: echo "TEST_TYPE=${{ github.event.inputs.test_type || 'smoke' }}" >> $GITHUB_ENV

      - name: Run K6 Test
        run: |
          echo "Running TEST_TYPE=$TEST_TYPE"
          k6 run \
            --summary-export=results/cli_summary.json \
            test_k6.js

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ github.event.inputs.test_type || 'smoke' }}
          path: results/
