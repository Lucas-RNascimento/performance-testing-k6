name: k6 Performance Tests

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      test_type:
        description: "Tipo de teste (smoke | load | stress)"
        required: false
        default: "smoke"

jobs:
  k6-tests:
    runs-on: ubuntu-latest

    env:
      CI: "true"                        # evita HTML no CI
      TEST_TYPE: ${{ github.event.inputs.test_type }}
      BASE_URL: "https://test-api.k6.io"
      ENDPOINT: "/public/crocodiles/"

    steps:
      # ------------------------------
      # Checkout
      # ------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------
      # Instalação segura do k6 (sem APT, sem key)
      # ------------------------------
      - name: Install k6
        run: |
          curl -sSL https://github.com/grafana/k6/releases/download/v0.51.0/k6-v0.51.0-linux-amd64.tar.gz -o k6.tar.gz
          tar -xzf k6.tar.gz
          sudo mv k6-v0.51.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version

      # ------------------------------
      # Criar pasta para resultados
      # ------------------------------
      - name: Create results folder
        run: mkdir -p results

      # ------------------------------
      # Rodar o Script próprio do CI
      # ------------------------------
      - name: Run k6 performance test (CI version)
        run: |
          echo "Running TEST_TYPE=$TEST_TYPE"
          k6 run test_k6_ci.js

      # ------------------------------
      # Upload do JSON como artifact
      # ------------------------------
      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: results/summary.json
